services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: onlineshop_nginx

    ports:
      - "80:80"

    depends_on:
      - frontend
      - backend

    networks:
      - shop_network

    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    
    container_name: onlineshop_backend
    expose:
      - "8000"

    env_file:
      - .env
    environment:
      FRONTEND_URL: http://localhost:3000
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: uvicorn main:app --host 0.0.0.0 --port 8000

    restart: unless-stopped

    networks:
      - shop_network

  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: http://localhost/api

    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost/api
    
    container_name: onlineshop_frontend
    expose:
      - "3000"

    env_file:
      - frontend/.env.local

    depends_on:
      - backend

    command: npm run start

    restart: unless-stopped

    networks:
      - shop_network

  postgres:
    image: postgres:16
    container_name: onlineshop_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - shop_network

  redis:
    image: redis:7
    container_name: onlineshop_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped

    networks:
      - shop_network

volumes:
  postgres_data:
  redis_data:


networks:
  shop_network: